<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020408">
<meta name="description" content="Офіційний персональний сайт Ярослава Войденка — студента-медика НМУ імені О. О. Богомольця, автора LIGA.net.">
<meta property="og:title" content="Ярослав Войденко — Офіційний сайт">
<meta property="og:description" content="Медицина. Журналістика. Суспільні ідеї.">
<meta property="og:type" content="website">
<title>Ярослав Войденко — Official Website</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #020408;
  --bg-surface: #060912;
  --panel: rgba(10, 16, 28, 0.75);
  --panel-glass: rgba(14, 22, 38, 0.65);
  --text: #f7f4ed;
  --muted: #9ba4b5;
  --subtle: #657187;
  --line: rgba(255, 255, 255, 0.08);
  --line-bright: rgba(216, 183, 120, 0.5);
  --gold: #e2be7d;
  --gold-light: #fae7c4;
  --gold-dim: rgba(226, 190, 125, 0.1);
  --shadow: 0 40px 100px rgba(0, 0, 0, 0.75);
  --radius: 28px;
  --max: 1260px;
}

body.light {
  --bg: #f6f4ee;
  --bg-surface: #ece8df;
  --panel: rgba(255, 255, 255, 0.75);
  --panel-glass: rgba(255, 255, 255, 0.6);
  --text: #0d1117;
  --muted: #5c677d;
  --subtle: #828e9e;
  --line: rgba(13, 17, 23, 0.08);
  --line-bright: rgba(152, 115, 61, 0.4);
  --gold: #98733d;
  --gold-light: #b88f52;
  --gold-dim: rgba(152, 115, 61, 0.08);
  --shadow: 0 30px 80px rgba(30, 25, 18, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  letter-spacing: -0.01em;
  line-height: 1.7;
  overflow-x: hidden;
  transition: background 0.4s ease, color 0.4s ease;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; }

/* PRELOADER */
#preloader {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: grid; place-items: center; transition: opacity 0.6s ease, visibility 0.6s ease;
}
#preloader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-mark {
  font: 700 48px 'Playfair Display', serif; color: var(--gold);
  border: 1px solid var(--line-bright); padding: 22px 34px; border-radius: 20px;
  background: var(--panel-glass); backdrop-filter: blur(30px);
  animation: pulseLoader 1.5s ease-in-out infinite;
}
@keyframes pulseLoader { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

/* CANVAS & FX */
#bgCanvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: 0.5; }
.progress-bar {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light)); z-index: 1000;
}
.cursor-glow {
  position: fixed; width: 500px; height: 500px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(226, 190, 125, 0.08), transparent 70%);
  transform: translate(-50%, -50%); z-index: -1; transition: transform 0.05s ease-out;
}

.container { width: min(var(--max), calc(100% - 64px)); margin: auto; }

/* APPLE GLASS HEADER */
header {
  position: sticky; top: 0; z-index: 400;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--line);
}
.nav { height: 90px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 700; }
.brand-mark {
  width: 44px; height: 44px; border: 1px solid var(--line-bright); border-radius: 12px;
  background: var(--gold-dim); color: var(--gold); display: grid; place-items: center;
  font-family: 'Playfair Display', serif; font-size: 19px; transition: transform 0.3s;
}
.brand:hover .brand-mark { transform: rotate(-5deg) scale(1.06); }
.brand small { display: block; font: 9px 'DM Mono', monospace; color: var(--muted); letter-spacing: 2.5px; }

.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a { font-size: 13px; font-weight: 500; color: var(--muted); transition: color 0.25s; position: relative; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); }
.nav-links a.active::after {
  content: ""; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--gold); border-radius: 2px;
}

.nav-actions { display: flex; gap: 10px; align-items: center; }
.action-btn, .menu-btn {
  border: 1px solid var(--line); background: var(--panel-glass); backdrop-filter: blur(15px); color: var(--text);
  border-radius: 30px; padding: 9px 16px; cursor: pointer; font-size: 12px; font-weight: 600;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.action-btn:hover, .menu-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
.menu-btn { display: none; }

/* STATUS BAR */
.status-bar {
  display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--panel-glass); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 50px;
  padding: 8px 20px; margin-bottom: 28px; font: 12px 'DM Mono', monospace; color: var(--muted);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
  box-shadow: 0 0 12px #4ade80; animation: blink 2s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.clock-display { color: var(--gold); font-weight: 500; }

/* HERO */
.hero { min-height: calc(100vh - 90px); display: flex; align-items: center; padding: 70px 0; }
.hero-grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 70px; align-items: center; width: 100%; }
.hero h1 { font: 600 clamp(50px, 6.8vw, 96px) / 1.02 'Playfair Display', serif; letter-spacing: -0.03em; margin-bottom: 22px; }
.hero h1 span { display: block; color: var(--gold); font-style: italic; }
.typewriter-wrap { font: 17px 'DM Mono', monospace; color: var(--gold); margin-bottom: 22px; min-height: 28px; }
.typewriter-cursor { animation: blink 0.8s infinite; }
.hero-lead { font-size: 1.18rem; color: var(--muted); max-width: 620px; margin-bottom: 38px; line-height: 1.8; }
.hero-lead strong { color: var(--text); font-weight: 600; }

.hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 50px; }
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 30px; border-radius: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; border: 1px solid transparent;
}
.btn-primary { background: var(--gold); color: #020408; border-color: var(--gold); }
.btn-primary:hover { background: var(--gold-light); transform: translateY(-4px); box-shadow: 0 15px 40px rgba(226, 190, 125, 0.4); }
.btn-outline { background: var(--panel-glass); backdrop-filter: blur(20px); border-color: var(--line); color: var(--text); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-4px); box-shadow: var(--shadow); }

.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; border-top: 1px solid var(--line); padding-top: 32px; }
.stat-box strong { display: block; font: 28px 'Playfair Display', serif; color: var(--gold); letter-spacing: -0.02em; }
.stat-box span { font: 10px 'DM Mono', monospace; color: var(--muted); letter-spacing: 2px; }

/* 3D HOLOGRAPHIC ORBIT */
.hero-visual { position: relative; display: flex; justify-content: center; align-items: center; min-height: 440px; }
.holo-wrapper { position: relative; width: 380px; height: 380px; display: grid; place-items: center; }
.orbit-ring {
  position: absolute; border: 1px solid var(--line-bright); border-radius: 50%;
  animation: spinOrbit 35s linear infinite;
}
.orbit-ring.r1 { width: 380px; height: 380px; animation-duration: 35s; border-color: rgba(226, 190, 125, 0.25); }
.orbit-ring.r2 { width: 280px; height: 280px; animation-duration: 22s; animation-direction: reverse; border-style: dashed; }
.orbit-ring.r3 { width: 190px; height: 190px; animation-duration: 15s; border-color: var(--gold); }
@keyframes spinOrbit { to { transform: rotate(360deg); } }

.holo-core {
  width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--panel), var(--bg));
  border: 2px solid var(--gold); box-shadow: 0 0 80px rgba(226, 190, 125, 0.35), inset 0 0 30px rgba(226, 190, 125, 0.2);
  display: grid; place-items: center; font: 52px 'Playfair Display', serif; color: var(--gold);
  z-index: 5; animation: pulseCore 4s ease-in-out infinite;
}
@keyframes pulseCore { 0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(226, 190, 125, 0.35); } 50% { transform: scale(1.04); box-shadow: 0 0 110px rgba(226, 190, 125, 0.55); } }

/* SECTIONS */
section { padding: 130px 0; border-top: 1px solid var(--line); position: relative; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-bottom: 60px; flex-wrap: wrap; }
.section-index { font: 11px 'DM Mono', monospace; color: var(--gold); letter-spacing: 3px; margin-bottom: 12px; }
.section h2 { font: 600 clamp(36px, 4.8vw, 60px) / 1.1 'Playfair Display', serif; letter-spacing: -0.03em; }
.section-intro { max-width: 460px; color: var(--muted); font-size: 1rem; line-height: 1.8; }
.gold { color: var(--gold); }

/* APPLE GLASS CARDS */
.card {
  background: var(--panel-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 45px; box-shadow: var(--shadow); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; overflow: hidden;
}
.card:hover { border-color: var(--line-bright); transform: translateY(-4px); box-shadow: 0 50px 120px rgba(0,0,0,0.8); }

/* BIOGRAPHY TABS */
.bio-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; }
.tab-group { display: flex; gap: 10px; flex-wrap: wrap; }
.tab-btn {
  padding: 10px 22px; border-radius: 30px; border: 1px solid var(--line); background: var(--panel-glass); backdrop-filter: blur(15px);
  color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.25s;
}
.tab-btn.active, .tab-btn:hover { background: var(--gold); color: #020408; border-color: var(--gold); transform: translateY(-2px); }
.reading-meta { font: 12px 'DM Mono', monospace; color: var(--gold); letter-spacing: 1px; }
.bio-panel { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.bio-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.bio-panel p { color: var(--muted); font-size: 1.1rem; margin-bottom: 20px; line-height: 1.9; }
.bio-panel strong { color: var(--text); font-weight: 600; }

/* SKILLS MATRIX */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 35px; }
.skill-item { background: var(--panel-glass); backdrop-filter: blur(15px); padding: 24px; border-radius: 18px; border: 1px solid var(--line); }
.skill-top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.skill-bar { height: 6px; background: var(--line); border-radius: 10px; overflow: hidden; }
.skill-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); width: 0%; transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1); }

/* DIRECTIONS */
.directions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.dir-icon {
  width: 56px; height: 56px; border-radius: 16px; background: var(--gold-dim);
  border: 1px solid var(--line-bright); display: grid; place-items: center; color: var(--gold); font-size: 24px; margin-bottom: 24px;
}
.direction-card h3 { font: 26px 'Playfair Display', serif; margin-bottom: 14px; letter-spacing: -0.02em; }
.direction-card p { font-size: 14px; color: var(--muted); line-height: 1.8; }

/* TIMELINE */
.timeline-list { display: grid; gap: 24px; max-width: 960px; margin: auto; }
.timeline-item { display: grid; grid-template-columns: 150px 1fr; gap: 28px; align-items: start; }
.timeline-item.hidden { display: none; }
.timeline-date { font: 12px 'DM Mono', monospace; color: var(--gold); padding-top: 10px; letter-spacing: 1px; }

/* QUOTE CAROUSEL */
.quote-banner {
  padding: 110px 0; text-align: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: radial-gradient(circle at center, var(--panel-glass) 0%, var(--bg) 100%);
  backdrop-filter: blur(30px); position: relative; overflow: hidden;
}
.quote-banner blockquote { font: italic clamp(24px, 3.5vw, 42px) / 1.35 'Playfair Display', serif; max-width: 900px; margin: 0 auto 28px; min-height: 110px; letter-spacing: -0.02em; }
.quote-controls { display: flex; justify-content: center; gap: 14px; margin-top: 24px; }

/* CONTACT & FORM */
.contact-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 60px; }
.contact-links { display: grid; gap: 16px; }
.contact-link-item {
  background: var(--panel-glass); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px;
  padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.contact-link-item:hover { border-color: var(--gold); transform: translateX(6px); box-shadow: var(--shadow); }
.contact-link-item small { display: block; font: 10px 'DM Mono', monospace; color: var(--muted); letter-spacing: 2px; margin-bottom: 4px; }
.contact-link-item strong { font-size: 15px; font-weight: 600; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; font: 11px 'DM Mono', monospace; color: var(--gold); margin-bottom: 8px; letter-spacing: 1.5px; }
.form-control {
  width: 100%; background: var(--bg-surface); border: 1px solid var(--line); color: var(--text);
  padding: 16px 18px; border-radius: 12px; font-family: inherit; font-size: 14px; transition: border-color 0.25s, box-shadow 0.25s;
}
.form-control:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 20px rgba(226, 190, 125, 0.15); }
textarea.form-control { min-height: 120px; resize: vertical; }

/* FLOATING TOP BUTTON WITH SVG PROGRESS */
.top-wrap {
  position: fixed; bottom: 30px; right: 30px; width: 54px; height: 54px; z-index: 500;
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
}
.top-wrap.show { opacity: 1; pointer-events: auto; }
.top-wrap:hover { transform: translateY(-4px); }
.top-wrap svg { transform: rotate(-90deg); width: 54px; height: 54px; }
.top-wrap circle { fill: var(--panel-glass); backdrop-filter: blur(10px); stroke: var(--line); stroke-width: 3; }
.top-wrap circle.prog { fill: none; stroke: var(--gold); stroke-dasharray: 138; stroke-dashoffset: 138; transition: stroke-dashoffset 0.1s; }
.top-arrow { position: absolute; inset: 0; display: grid; place-items: center; color: var(--gold); font-size: 18px; font-weight: bold; }

/* COMMAND PALETTE MODAL */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px);
  z-index: 2000; display: none; place-items: center; padding: 20px;
}
.modal-backdrop.open { display: grid; }
.cmd-modal {
  width: 100%; max-width: 560px; background: var(--panel-glass); backdrop-filter: blur(35px); border: 1px solid var(--line-bright);
  border-radius: 22px; overflow: hidden; box-shadow: var(--shadow);
}
.cmd-input {
  width: 100%; padding: 20px 24px; background: transparent; border: none; border-bottom: 1px solid var(--line);
  color: var(--text); font-size: 16px; outline: none;
}
.cmd-list { max-height: 320px; overflow-y: auto; padding: 12px; }
.cmd-item {
  padding: 14px 18px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between;
  font-size: 14px; color: var(--muted); transition: background 0.2s, color 0.2s;
}
.cmd-item:hover { background: var(--gold-dim); color: var(--gold); }

/* TOAST */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--gold); color: #020408; padding: 13px 26px; border-radius: 30px;
  font-size: 13px; font-weight: 700; z-index: 3000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* MOBILE MENU */
.mobile-panel {
  display: none; position: absolute; top: 90px; left: 0; width: 100%;
  background: var(--panel-glass); backdrop-filter: blur(35px); border-bottom: 1px solid var(--line); padding: 28px;
  flex-direction: column; gap: 18px; z-index: 350; box-shadow: var(--shadow);
}
.mobile-panel.open { display: flex; }
.mobile-panel a { font-size: 16px; font-weight: 600; color: var(--muted); transition: color 0.2s; }
.mobile-panel a:hover { color: var(--gold); }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.visible { opacity: 1; transform: none; }

footer { padding: 45px 0; border-top: 1px solid var(--line); background: var(--bg-surface); }
.footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted); }

@media(max-width: 960px) {
  .hero-grid, .contact-grid, .directions-grid, .skills-grid { grid-template-columns: 1fr; }
  .hero-visual { order: -1; min-height: 340px; }
  .holo-wrapper { width: 300px; height: 300px; }
  .orbit-ring.r1 { width: 300px; height: 300px; }
  .orbit-ring.r2 { width: 220px; height: 220px; }
  .orbit-ring.r3 { width: 150px; height: 150px; }
}
@media(max-width: 768px) {
  .nav-links { display: none; }
  .menu-btn { display: block; }
  .timeline-item { grid-template-columns: 1fr; gap: 10px; }
  .card { padding: 30px; }
}
@media print {
  header, #bgCanvas, .cursor-glow, .top-wrap, .hero-visual, .nav-actions, .tab-group, form, footer { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border: 1px solid #ccc; box-shadow: none; }
  .bio-panel { display: block !important; }
}
</style>
</head>
<body>

<div id="preloader"><div class="loader-mark">YV</div></div>
<canvas id="bgCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="progress-bar" id="progressBar"></div>

<header>
  <div class="container nav">
    <a class="brand" href="#home">
      <span class="brand-mark">YV</span>
      <span>YAROSLAV VOIDENKO<small>KYIV · UKRAINE</small></span>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="#biography" data-ua="Біографія" data-en="Biography">Біографія</a>
      <a href="#directions" data-ua="Напрями" data-en="Fields">Напрями</a>
      <a href="#journey" data-ua="Хронологія" data-en="Timeline">Хронологія</a>
      <a href="#journalism" data-ua="Публікації" data-en="Writing">Публікації</a>
      <a href="#contact" data-ua="Контакти" data-en="Contact">Контакти</a>
    </nav>

    <div class="nav-actions">
      <button class="action-btn" id="cmdBtn" title="Пошук (Ctrl+K)">⌘K</button>
      <button class="action-btn" id="fontBtn" title="Розмір шрифту">A+</button>
      <button class="action-btn" id="langBtn">EN</button>
      <button class="action-btn" id="themeBtn">☼</button>
      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
  </div>
  <div class="mobile-panel" id="mobilePanel">
    <a href="#biography">Біографія</a>
    <a href="#directions">Напрями</a>
    <a href="#journey">Хронологія</a>
    <a href="#journalism">Публікації</a>
    <a href="#contact">Контакти</a>
  </div>
</header>

<main>
<section class="hero" id="home">
  <div class="container hero-grid">
    <div class="reveal">
      <div class="status-bar">
        <span class="live-dot"></span>
        <span id="greetingText">Доброго вечора</span>
        <span>·</span>
        <span class="clock-display" id="kyivClock">00:00:00</span>
        <span>(Київ)</span>
      </div>

      <h1>Ярослав <span>Войденко.</span></h1>
      <div class="typewriter-wrap"><span id="typewriter"></span><span class="type
